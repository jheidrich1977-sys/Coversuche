# Baut automatisch die Windows-Programmdatei Coversuche.exe.
# Läuft bei jedem Hochladen (Push) und kann auf GitHub unter
# "Actions" > "Windows-Programm bauen" > "Run workflow" auch per Hand gestartet werden.
name: Windows-Programm bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotheken installieren
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.16.0 pytest
      - name: Tests ausfuehren
        run: python -m pytest -q
      - name: Coversuche.exe bauen
        run: pyinstaller --onefile --windowed --name Coversuche start.py
      - name: Coversuche.exe zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Coversuche-Windows
          path: dist/Coversuche.exe
